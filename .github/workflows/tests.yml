name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --break-system-packages rdkit pandas pyarrow \
            psycopg2-binary boto3 python-dotenv chembl_downloader \
            requests pytest

      - name: Run tests
        run: python -m pytest tests/ -v